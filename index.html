let cur=iso(new Date()),tab='today';
const day=d=>S.days[d]||(S.days[d]={food:[],supps:{}});
const tot=d=>{const t={k:0,p:0,c:0,f:0};((S.days[d]||{}).food||[]).forEach(x=>{for(const m in t)t[m]+=+x[m]||0});return t};
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',1500)}
function shift(n){const d=new Date(cur+'T12:00');d.setDate(d.getDate()+n);cur=iso(d);render()}
$('date').onchange=e=>{if(e.target.value){cur=e.target.value;render()}};
const TABS=[["today","🍽","Today"],["workout","🏋","Workout"],["body","⚖","Body"],["supps","💊","Supps"],["history","📅","History"],["settings","⚙","Settings"]];
function ring(v,t,col,lab,u){const r=26,C=2*Math.PI*r,pc=Math.min(v/t,1);return `<div><svg width="66" height="66" viewBox="0 0 66 66"><circle cx="33" cy="33" r="${r}" fill="none" stroke="#2a2f3a" stroke-width="7"/><circle cx="33" cy="33" r="${r}" fill="none" stroke="${v>t*1.05?'#f87171':col}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C*pc} ${C}" transform="rotate(-90 33 33)"/><text x="33" y="37" text-anchor="middle" fill="#e8eaf0" font-size="13" font-weight="700">${Math.round(v)}</text></svg><small>${lab} / ${t}${u}</small><small>${Math.round(t-v)>=0?Math.round(t-v)+u+' left':Math.round(v-t)+u+' over'}</small></div>`}
function addFood(o){day(cur).food.push(Object.assign({id:Date.now()+Math.random(),t:new Date().toTimeString().slice(0,5)},o));save();toast('Added '+o.n);render()}
function fmt(x){return `${Math.round(x.k)} kcal · P${Math.round(x.p)} C${Math.round(x.c)} F${Math.round(x.f)}`}
const V={};
V.today=()=>{const t=tot(cur),T=S.settings,d=day(cur);
let h=`<div class="card"><div class="rings">${ring(t.k,T.k,'var(--k)','kcal','')}${ring(t.p,T.p,'var(--p)','P','g')}${ring(t.c,T.c,'var(--c)','C','g')}${ring(t.f,T.f,'var(--f)','F','g')}</div></div>`;
h+=`<div class="card"><h2>Logged (${d.food.length})</h2>${d.food.length?d.food.map(x=>`<div class="item"><div><b>${esc(x.n)}</b>${x.q&&x.q!=1?' ×'+x.q:''}<div class="mu">${x.t||''} · ${fmt(x)}</div></div><button class="sm del" onclick="rmFood(${x.id})">✕</button></div>`).join(''):'<div class="mu">Nothing yet — tap a meal or food below.</div>'}</div>`;
h+=`<div class="card"><h2>Plan meals</h2>`+Object.entries(DATA.meals).map(([s,a],i)=>`<details${i==0?'':''}><summary>${esc(s)}</summary>${a.map((m,j)=>`<div class="meal" onclick="addMeal('${esc(s)}',${j})"><b>${esc(m.n)}</b> <span class="mu">${fmt(m)}</span><div class="mu">${esc(m.d)}</div></div>`).join('')}</details>`).join('')+`</div>`;
const lib=FOODS.map(f=>({n:f[0],k:f[1],p:f[2],c:f[3],f:f[4]})).concat(S.customFoods);
h+=`<div class="card"><h2>Quick-add foods</h2><div class="row" style="margin-bottom:8px"><span class="mu" style="flex:0 0 auto">Qty ×</span><input id="qty" type="number" step="0.5" value="1" style="flex:0 0 70px"></div><div class="chips">${lib.map((f,i)=>`<button class="chip" onclick="quick(${i})" title="${fmt(f)}">${esc(f.n)}</button>`).join('')}</div></div>`;
h+=`<div class="card"><h2>Custom food</h2><input id="cn" placeholder="Name"><div class="row" style="margin-top:6px"><input id="ck" type="number" placeholder="kcal"><input id="cp" type="number" placeholder="P g"><input id="cc" type="number" placeholder="C g"><input id="cf" type="number" placeholder="F g"></div><div class="row" style="margin-top:8px"><button class="pri" onclick="custom(0)">Add</button><button onclick="custom(1)">Add + save to library</button></div></div>`;
window._lib=lib;return h};
function addMeal(s,j){const m=DATA.meals[s][j];addFood({n:m.n,k:m.k,p:m.p,c:m.c,f:m.f,slot:s})}
function quick(i){const f=_lib[i],q=+$('qty').value||1;addFood({n:f.n,q,k:f.k*q,p:f.p*q,c:f.c*q,f:f.f*q})}
function custom(sv){const o={n:$('cn').value.trim()||'Custom',k:+$('ck').value||0,p:+$('cp').value||0,c:+$('cc').value||0,f:+$('cf').value||0};if(sv){S.customFoods.push(o)}addFood(o)}
function rmFood(id){const d=day(cur);d.food=d.food.filter(x=>x.id!==id);save();render()}
// Workout
const wkey=d=>S.workouts[d];
function lastFor(name,before){const ds=Object.keys(S.workouts).filter(d=>d<before).sort().reverse();for(const d of ds){const w=S.workouts[d];const e=w.ex&&w.ex[name];if(e&&e.some(s=>s.w||s.r))return{d,sets:e}}return null}
const DOWMAP={1:'UA',2:'LA',4:'UB',5:'LB',6:'C'};
V.workout=()=>{let w=S.workouts[cur];const sel=w?w.k:(DOWMAP[new Date(cur+'T12:00').getDay()]||'');
let h=`<div class="card"><h2>Session</h2><select id="ws" onchange="pickW(this.value)"><option value="">— Rest day / choose —</option>${DATA.days.map(d=>`<option value="${d.k}" ${sel==d.k?'selected':''}>${esc(d.dow+' · '+d.t)}</option>`).join('')}</select>${w?'':`${sel?`<button class="pri" style="margin-top:8px;width:100%" onclick="pickW('${sel}')">Start ${esc(DATA.days.find(d=>d.k==sel).t)}</button>`:''}`}</div>`;
if(!w)return h;const D=DATA.days.find(d=>d.k==w.k);
h+=`<div class="card ${w.done?'done':''}"><h2>${esc(D.t)}</h2><div class="mu">Log weight (kg) × reps. Yellow = last session. Beat it by a rep or +2–2.5 kg when you hit the top of the range on all sets.</div>`;
D.ex.forEach((e,i)=>{const L=lastFor(e.n,cur),sets=w.ex[e.n]||(w.ex[e.n]=Array.from({length:e.sets},()=>({w:'',r:''})));
h+=`<div class="ex"><h3>${i+1}. ${esc(e.n)}${e.abs?' <span class="mu">(abs)</span>':''}</h3><div class="mu">${e.sets} × ${esc(e.reps)} · rest ${esc(e.rest)} · <a href="${e.v}" target="_blank" rel="noopener">▶ video</a></div><div class="mu">${esc(e.tip)}</div>${L?`<div class="last">Last (${L.d}): ${L.sets.filter(s=>s.w||s.r).map(s=>(s.w||'BW')+'×'+(s.r||'?')).join(', ')}</div>`:'<div class="last">No previous log</div>'}
<div class="sets">${sets.map((s,j)=>`<span class="mu">S${j+1}</span><input inputmode="decimal" placeholder="${L&&L.sets[j]?L.sets[j].w||'kg':'kg'}" value="${esc(s.w)}" onchange="setv('${esc(e.n)}',${j},'w',this.value)"><input inputmode="numeric" placeholder="${L&&L.sets[j]?L.sets[j].r||'reps':'reps'}" value="${esc(s.r)}" onchange="setv('${esc(e.n)}',${j},'r',this.value)"><button class="sm" onclick="rmSet('${esc(e.n)}',${j})">−</button>`).join('')}</div><button class="sm" style="margin-top:6px" onclick="addSet('${esc(e.n)}')">+ set</button></div>`});
h+=`<textarea id="wn" placeholder="Notes" style="width:100%;margin-top:8px;background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px" onchange="S.workouts[cur].notes=this.value;save()">${esc(w.notes||'')}</textarea>
<div class="row" style="margin-top:8px"><button class="${w.done?'':'pri'}" onclick="S.workouts[cur].done=!S.workouts[cur].done;save();render()">${w.done?'✓ Completed (undo)':'Mark complete'}</button><button class="del" onclick="if(confirm('Delete this session log?')){delete S.workouts[cur];save();render()}">Delete</button></div></div>`;return h};
function pickW(k){if(!k){if(S.workouts[cur]&&confirm('Remove session?'))delete S.workouts[cur];}else if(!S.workouts[cur]||S.workouts[cur].k!==k){if(S.workouts[cur]&&!confirm('Switch session? Current logs for today will be replaced.'))return render();S.workouts[cur]={k,ex:{},done:false}}save();render()}
function setv(n,j,f,v){S.workouts[cur].ex[n][j][f]=v.trim();save()}
function addSet(n){S.workouts[cur].ex[n].push({w:'',r:''});save();render()}
function rmSet(n,j){S.workouts[cur].ex[n].splice(j,1);save();render()}
// Body
function avg7(end){const a=[];for(let i=0;i<7;i++){const d=new Date(end+'T12:00');d.setDate(d.getDate()-i);const b=S.body[iso(d)];if(b&&b.w)a.push(+b.w)}return a.length?a.reduce((x,y)=>x+y)/a.length:null}
function chart(){const ds=Object.keys(S.body).filter(d=>S.body[d].w).sort().slice(-60);if(ds.length<2)return '<div class="mu">Log 2+ days to see the chart.</div>';
const ws=ds.map(d=>+S.body[d].w),av=ds.map(d=>avg7(d)),all=ws.concat(av);let mn=Math.min(...all)-.5,mx=Math.max(...all)+.5;const W=600,H=200,X=i=>20+i*(W-40)/(ds.length-1),Y=v=>H-20-(v-mn)/(mx-mn)*(H-40);
return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto"><text x="2" y="14" fill="#8b93a5" font-size="12">${mx.toFixed(1)}</text><text x="2" y="${H-4}" fill="#8b93a5" font-size="12">${mn.toFixed(1)}</text>${ws.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="3" fill="#60a5fa" opacity=".6"/>`).join('')}<polyline fill="none" stroke="#4ade80" stroke-width="3" points="${av.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/><text x="${W-4}" y="14" text-anchor="end" fill="#8b93a5" font-size="12">${ds[0]} → ${ds[ds.length-1]} · dots=daily, line=7d avg</text></svg>`}
V.body=()=>{const b=S.body[cur]||{},a=avg7(cur),pd=new Date(cur+'T12:00');pd.setDate(pd.getDate()-7);const pa=avg7(iso(pd));
return `<div class="card"><h2>Morning weigh-in (${cur})</h2><div class="row"><input id="bw" type="number" step="0.1" inputmode="decimal" placeholder="Weight kg" value="${b.w||''}"><input id="bwa" type="number" step="0.1" inputmode="decimal" placeholder="Waist cm (opt.)" value="${b.waist||''}"></div><button class="pri" style="margin-top:8px;width:100%" onclick="saveBody()">Save</button></div>
<div class="card"><div class="row"><div><div class="mu">7-day avg</div><div class="big">${a?a.toFixed(1):'–'}</div></div><div><div class="mu">vs prev week</div><div class="big">${a&&pa?((a-pa>0?'+':'')+(a-pa).toFixed(2)):'–'}</div></div></div><div class="mu">Lean bulk: aim ~+0.25–0.5 kg/week on the 7-day average.</div></div><div class="card"><h2>Trend</h2>${chart()}</div>
<div class="card"><h2>Recent</h2>${Object.keys(S.body).sort().reverse().slice(0,14).map(d=>`<div class="item"><span>${d}</span><span>${S.body[d].w||'–'} kg${S.body[d].waist?' · '+S.body[d].waist+' cm':''}</span></div>`).join('')||'<div class="mu">No entries</div>'}</div>`};
function saveBody(){const w=$('bw').value,wa=$('bwa').value;if(!w&&!wa)delete S.body[cur];else S.body[cur]={w:w?+w:null,waist:wa?+wa:null};save();toast('Saved');render()}
V.supps=()=>{const d=day(cur);return `<div class="card"><h2>Supplements · ${cur}</h2>${SUPPS.map(s=>`<label class="chk"><input type="checkbox" ${d.supps[s]?'checked':''} onchange="day(cur).supps['${s}']=this.checked;save();render()">${s}</label>`).join('')}<div class="mu" style="margin-top:8px">${SUPPS.filter(s=>d.supps[s]).length}/${SUPPS.length} done</div></div>`};
// history
function active(d){const x=S.days[d];return !!((x&&(x.food.length||Object.values(x.supps||{}).some(Boolean)))||S.workouts[d]||S.body[d])}
function hit(d){const t=tot(d),T=S.settings;return t.p>=T.p*.9&&Math.abs(t.k-T.k)<=T.k*.1}
function streak(){let n=0;const d=new Date();if(!active(iso(d)))d.setDate(d.getDate()-1);while(active(iso(d))){n++;d.setDate(d.getDate()-1)}return n}
let calM=null;
V.history=()=>{const base=calM||cur.slice(0,7),[Y,Mo]=base.split('-').map(Number),first=new Date(Y,Mo-1,1),dim=new Date(Y,Mo,0).getDate(),off=(first.getDay()+6)%7,td=iso(new Date());
let c='';for(let i=0;i<off;i++)c+='<div class="h"></div>';for(let i=1;i<=dim;i++){const d=`${base}-${String(i).padStart(2,'0')}`;c+=`<div class="${active(d)?(hit(d)?'g':'y'):''} ${d==td?'t':''}" onclick="cur='${d}';tab='today';render()">${i}${S.workouts[d]?'<br>🏋':''}</div>`}
const ws=Object.keys(S.workouts).filter(d=>S.workouts[d].done);const wk=ws.filter(d=>(new Date(td)-new Date(d))/864e5<7).length;
const list=[...new Set(Object.keys(S.days).concat(Object.keys(S.workouts),Object.keys(S.body)))].filter(active).sort().reverse().slice(0,60);
return `<div class="card"><div class="row"><div><div class="mu">Logging streak</div><div class="big">🔥 ${streak()} d</div></div><div><div class="mu">Workouts last 7d</div><div class="big">${wk}/4</div></div></div></div>
<div class="card"><div class="row" style="margin-bottom:8px"><button class="sm" style="flex:0" onclick="mv(-1)">‹</button><b style="text-align:center">${first.toLocaleString('en-GB',{month:'long',year:'numeric'})}</b><button class="sm" style="flex:0" onclick="mv(1)">›</button></div><div class="cal">${'MTWTFSS'.split('').map(x=>`<div class="h">${x}</div>`).join('')}${c}</div><div class="mu" style="margin-top:6px">Green = within ±10% kcal & ≥90% protein · amber = logged. Tap a day to open it.</div></div>
<div class="card"><h2>Days</h2>${list.map(d=>{const t=tot(d),w=S.workouts[d];return `<div class="item" onclick="cur='${d}';tab='today';render()" style="cursor:pointer"><div><b>${d}</b><div class="mu">${fmt(t)}${w?' · 🏋 '+w.k+(w.done?' ✓':''):''}${S.body[d]&&S.body[d].w?' · '+S.body[d].w+'kg':''}</div></div><span>${hit(d)?'✅':''}</span></div>`}).join('')||'<div class="mu">No history yet</div>'}</div>`};
function mv(n){const b=calM||cur.slice(0,7);let [y,m]=b.split('-').map(Number);m+=n;if(m<1){m=12;y--}if(m>12){m=1;y++}calM=`${y}-${String(m).padStart(2,'0')}`;render()}
// settings / backup
V.settings=()=>{const T=S.settings;return `<div class="card"><h2>Daily targets</h2>${[['k','kcal'],['p','Protein g'],['f','Fat g'],['c','Carbs g']].map(([k,l])=>`<label class="mu">${l}<input type="number" value="${T[k]}" onchange="S.settings.${k}=+this.value||0;save()"></label>`).join('')}<div class="mu" style="margin-top:6px">Default: 2800 kcal · 165 P · 78 F · 360 C (vegetarian + eggs)</div></div>
<div class="card"><h2>Backup (data lives only on this device)</h2><div class="row" style="flex-wrap:wrap"><button class="pri" onclick="exportJSON()">Export JSON</button><button onclick="$('imp').click()">Import JSON</button></div><div class="row" style="margin-top:8px"><button onclick="exportCSV('food')">CSV: daily totals</button><button onclick="exportCSV('sets')">CSV: workout sets</button></div><input type="file" id="imp" accept=".json,application/json" style="display:none" onchange="importJSON(this.files[0])"><div class="mu" style="margin-top:8px">Export regularly and move the file between phone/laptop. Import replaces all data on this device.</div></div>
<div class="card"><h2>Saved custom foods</h2>${S.customFoods.map((f,i)=>`<div class="item"><span>${esc(f.n)} <span class="mu">${fmt(f)}</span></span><button class="sm del" onclick="S.customFoods.splice(${i},1);save();render()">✕</button></div>`).join('')||'<div class="mu">None</div>'}</div>
<div class="card"><button class="del" onclick="if(confirm('Erase ALL data on this device?')){S=structuredClone(DEF);save();render()}">Erase all data</button></div>`};
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function exportJSON(){dl(`vyom-tracker-${iso(new Date())}.json`,JSON.stringify({app:'vyom-tracker',v:1,exported:new Date().toISOString(),data:S},null,1),'application/json')}
const q=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function exportCSV(kind){let r;if(kind=='food'){const ds=[...new Set(Object.keys(S.days).concat(Object.keys(S.body),Object.keys(S.workouts)))].sort();r=[['date','kcal','protein_g','carbs_g','fat_g','items','supplements','workout','workout_done','weight_kg','waist_cm']].concat(ds.map(d=>{const t=tot(d),x=S.days[d]||{food:[],supps:{}},w=S.workouts[d],b=S.body[d]||{};return [d,Math.round(t.k),Math.round(t.p),Math.round(t.c),Math.round(t.f),x.food.map(f=>f.n).join('; '),Object.keys(x.supps||{}).filter(s=>x.supps[s]).join('; '),w?w.k:'',w?(w.done?1:0):'',b.w||'',b.waist||'']}))}
else{r=[['date','session','exercise','set','weight_kg','reps']];Object.keys(S.workouts).sort().forEach(d=>{const w=S.workouts[d];Object.entries(w.ex||{}).forEach(([n,ss])=>ss.forEach((s,i)=>{if(s.w||s.r)r.push([d,w.k,n,i+1,s.w,s.r])}))})}
dl(`vyom-${kind}-${iso(new Date())}.csv`,r.map(x=>x.map(q).join(',')).join('\n'),'text/csv')}
function importJSON(f){if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result),d=o.data||o;if(!d.days||!d.settings)throw 0;if(!confirm('Replace all data on this device with this backup?'))return;S=Object.assign(structuredClone(DEF),d);save();toast('Imported');render()}catch(e){alert('Not a valid tracker backup')}};rd.readAsText(f)}
function render(){$('date').value=cur;$('nav').innerHTML=TABS.map(([k,i,l])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';calM=null;render()"><b>${i}</b>${l}</button>`).join('');$('app').innerHTML=V[tab]();}
function closeM(){$('modal').style.display='none'}
render();
</script><script>if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");</script>
</body></html>
